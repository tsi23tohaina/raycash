org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Désactive l'incremental Kotlin compile car PUB_CACHE est sur C:\ et le projet
# sur D:\ — le compiler Kotlin n'arrive pas à calculer les chemins relatifs entre
# drives Windows ("this and base files have different roots"). Désactiver l'incremental
# rend les builds un peu plus lents mais résout le crash.
kotlin.incremental=false
