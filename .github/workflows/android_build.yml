name: Build Raycash APK

on:
  push:
    branches: [buildcheck, main]
  pull_request:
    branches: [main]

jobs:
  flutter-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze (static analysis + lints)
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

  build-apk:
    needs: flutter-quality
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/buildcheck' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --dart-define=RAYCASH_API_KEY=${{ secrets.RAYCASH_API_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: raycash-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
